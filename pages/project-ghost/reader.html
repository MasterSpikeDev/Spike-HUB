<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Project Ghost — Reader Imersivo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg:#07070b;
      --text:#f3f3f3;
      --muted:#babaca;
      --panel:rgba(10,10,14,.78);
      --border:rgba(255,255,255,.09);
      --accent:#ff3a3a;
      --accent-soft: rgba(255, 58, 58, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); overflow:hidden; font-family: Georgia, serif; }
    body.start-gate-active .reader, body.start-gate-active .bg-layer, body.start-gate-active > .overlay { visibility:hidden; pointer-events:none; }
    .bg-layer { position:fixed; inset:0; transition:opacity .8s ease; overflow:hidden; background:#000; }
    .bg-layer.active { z-index:1; opacity:1; }
    .bg-layer.inactive { z-index:0; opacity:0; }
    .bg-image, .bg-video {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .bg-image { background-size:cover; background-position:center; background-repeat:no-repeat; }
    .bg-video { display:none; }
    .overlay { position:fixed; inset:0; z-index:2; background:linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.68)); }
    #readerFireParticles { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:21; opacity:.88; }
    .reader-fire-ambience { position:fixed; inset:0; pointer-events:none; z-index:20; background:radial-gradient(circle at 50% 110%, rgba(255,80,0,.28), transparent 45%), radial-gradient(circle at 10% 0%, rgba(255,30,0,.09), transparent 40%), radial-gradient(circle at 90% 15%, rgba(255,140,0,.08), transparent 35%); mix-blend-mode:screen; animation: readerFireAmbienceShift 12s ease-in-out infinite alternate; }
    @keyframes readerFireAmbienceShift { 0% { filter:saturate(1) brightness(1); } 100% { filter:saturate(1.15) brightness(1.08); } }
    .reader-fire-spark { position:fixed; bottom:-40px; width:4px; height:4px; border-radius:50%; pointer-events:none; background:radial-gradient(circle, #ffe8a8 0%, #ff8f1f 65%, transparent 100%); box-shadow:0 0 12px rgba(255,109,22,.8); opacity:0; z-index:22; animation-name: readerFloatSpark; animation-timing-function:linear; animation-iteration-count:infinite; }
    @keyframes readerFloatSpark { 0% { transform:translate3d(0,0,0) scale(.8); opacity:0; } 12% { opacity:1; } 100% { transform:translate3d(var(--drift-x,30px), -120vh, 0) scale(.15); opacity:0; } }
    .reader { position:relative; z-index:5; display:grid; grid-template-rows:auto 1fr; height:100%; }
    .bar { display:grid; grid-template-columns:1fr auto; gap:10px 14px; align-items:center; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--border); backdrop-filter: blur(8px); box-shadow: 0 12px 28px rgba(0,0,0,.32); overflow:hidden; transition:grid-template-rows .28s ease, padding .28s ease; }
    .reader-heading { display:flex; flex-direction:column; gap:4px; min-width:0; }
    .top-page-status { color:var(--muted); font-size:13px; line-height:1.2; }
    .controls { display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .control-btn, select, input[type=range] { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:999px; padding:8px 12px; }
    .control-btn { display:inline-flex; align-items:center; gap:8px; cursor:pointer; transition:transform .18s ease, border-color .18s ease, background .18s ease; }
    .control-btn:hover { transform:translateY(-1px); border-color:var(--accent-soft); background:rgba(255,255,255,.08); }
    .control-btn.icon-only { width:42px; height:42px; justify-content:center; padding:0; font-size:1rem; }
    .media-player {
      grid-column:1 / -1;
      display:grid;
      grid-template-columns:auto minmax(180px, 1fr) auto;
      gap:12px;
      align-items:center;
      max-height:150px;
      opacity:1;
      transform:translateY(0);
      overflow:hidden;
      transition:max-height .34s ease, opacity .24s ease, transform .34s ease, margin .34s ease;
    }
    .bar.media-collapsed .media-player, .bar.media-unavailable .media-player { max-height:0; opacity:0; transform:translateY(-110%); margin-top:-10px; pointer-events:none; }
    .bar.media-collapsed #mediaToggleIcon { transform:rotate(180deg); }
    .bar.media-unavailable #mediaToggle { display:none; }
    #mediaToggleIcon { transition:transform .25s ease; }
    .media-cover-wrap { position:relative; width:58px; height:58px; flex:0 0 auto; }
    .media-cover {
      width:100%;
      height:100%;
      border-radius:14px;
      object-fit:cover;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.13);
      box-shadow:0 0 calc(10px + var(--beat, 0) * 24px) rgba(255,58,58,.28);
      transform:scale(calc(1 + var(--beat, 0) * .045));
      transition:transform .08s linear, box-shadow .08s linear;
    }
    .media-cover-wrap::after {
      content:'';
      position:absolute;
      inset:-5px;
      border-radius:18px;
      border:1px solid rgba(255,58,58,calc(.18 + var(--beat, 0) * .4));
      opacity:calc(.35 + var(--beat, 0) * .55);
      pointer-events:none;
    }
    .media-info { display:grid; gap:7px; min-width:0; }
    .media-title-row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; min-width:0; }
    .media-title { font-weight:800; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .media-subtitle { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .media-time { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .media-progress-row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; }
    .media-progress, .media-volume { accent-color:var(--accent); cursor:pointer; padding:0; background:transparent; border:none; }
    .media-progress { width:100%; min-width:120px; }
    .media-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
    .media-icon-btn {
      width:38px;
      height:38px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.055);
      color:var(--text);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      text-decoration:none;
      transition:transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .media-icon-btn:hover { transform:translateY(-1px); border-color:var(--accent-soft); background:rgba(255,255,255,.1); }
    .media-icon-btn.disabled { opacity:.42; pointer-events:none; }
    .media-play { width:44px; height:44px; background:linear-gradient(135deg, rgba(255,58,58,.85), rgba(255,255,255,.12)); }
    .media-volume { width:96px; }
    .visualizer { display:flex; align-items:end; gap:3px; height:28px; min-width:42px; }
    .visualizer span {
      display:block;
      width:4px;
      height:calc(6px + var(--level, .2) * 22px);
      border-radius:999px;
      background:linear-gradient(180deg, #fff, var(--accent));
      box-shadow:0 0 12px rgba(255,58,58,.35);
      transition:height .08s linear;
    }
    .viewer {
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:18px 8px;
      min-height:0;
      position: relative;
      overflow:auto;
      overscroll-behavior:contain;
      touch-action:pan-x pan-y pinch-zoom;
      scrollbar-color: var(--accent) rgba(255,255,255,.08);
    }
    .viewer-stage {
      width:100%;
      min-height:100%;
      display:flex;
      justify-content:center;
    }
    .page-host {
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      position:relative;
    }
    .page-frame {
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }
    canvas {
      display:block;
      flex:0 0 auto;
      max-width:none;
      max-height:none;
      border-radius:12px;
      box-shadow:0 18px 60px rgba(0,0,0,.4);
      background:#ececef;
      user-select:none;
    }
    .page-frame:not(.is-rendered)::before {
      content:'Carregando página ' attr(data-page);
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      border:1px dashed rgba(255,255,255,.14);
      border-radius:12px;
      background:rgba(255,255,255,.045);
      pointer-events:none;
    }
    .pdf-page-number {
      position:absolute;
      right:12px;
      bottom:12px;
      padding:5px 9px;
      border-radius:999px;
      background:rgba(0,0,0,.58);
      color:#fff;
      font-size:12px;
      line-height:1;
      pointer-events:none;
    }
    .start {
      --start-bg: #000;
      --slice-gap: 0%;
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--start-bg);
      overflow: hidden;
      isolation:isolate;
    }
    .start::before,
    .start::after {
      content:'';
      position:absolute;
      top:0;
      bottom:0;
      width:calc(50% + 2px);
      z-index:19;
      pointer-events:none;
      background:var(--start-bg);
      transition:transform 1.05s cubic-bezier(.76, 0, .18, 1), filter .85s ease;
    }
    .start::before { left:0; transform:translateX(calc(var(--slice-gap) * -1)); box-shadow:18px 0 44px rgba(255,58,58,.18); }
    .start::after { right:0; transform:translateX(var(--slice-gap)); box-shadow:-18px 0 44px rgba(255,58,58,.18); }
    .start.is-opening { pointer-events:none; }
    .start.is-opening::before { transform:translateX(-105%) skewY(-4deg); filter:brightness(1.25); }
    .start.is-opening::after { transform:translateX(105%) skewY(4deg); filter:brightness(1.25); }
    .start.is-opening .card,
    .start.is-opening #readerFireParticles,
    .start.is-opening .reader-fire-ambience,
    .start.is-opening .reader-fire-spark { animation:startGateVanish .7s ease forwards; }
    @keyframes startGateVanish { to { opacity:0; transform:scale(1.06); } }
    .card {
      position: relative;
      z-index: 23;
      width: min(980px, 94vw);
      min-height: min(760px, 92vh);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      justify-items: center;
      background: transparent;
      border: 0;
      padding: 24px;
    }
    .start-cover-frame {
      min-height: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .start-cover-frame canvas {
      max-width: min(100%, 720px);
      max-height: 72vh;
      width: auto !important;
      height: auto !important;
      border-radius: 14px;
      box-shadow: 0 28px 90px rgba(0,0,0,.74), 0 0 46px rgba(255,58,58,.22);
    }
    .start-actions { width:min(520px, 100%); display:grid; gap:10px; justify-items:center; }
    .start-title { display:none; }
    .start-main-btn {
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(255, 110, 110, 0.62);
      background: linear-gradient(90deg, #7b0612 0%, #d41425 52%, #ff5868 100%);
      color: #fff;
      font-size: 1.02rem;
      font-weight: 900;
      letter-spacing: .05em;
      padding: 15px 18px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      text-transform: uppercase;
      box-shadow:0 14px 34px rgba(255, 61, 77, .25);
    }
    .start-main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(255, 61, 77, 0.45);
    }
    .start-main-btn.is-igniting {
      animation:startButtonIgnite .72s ease forwards;
    }
    @keyframes startButtonIgnite {
      0% { transform:scale(1); filter:brightness(1); }
      45% { transform:scale(.96); filter:brightness(1.35); box-shadow:0 0 34px rgba(255,118,32,.75), 0 0 74px rgba(255,45,28,.42); }
      100% { transform:scale(1.08); filter:brightness(1.8); opacity:.18; }
    }
    #loading { position:fixed; z-index:15; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.8); padding:10px 14px; border-radius:10px; border:1px solid var(--border); display:none; }
    @media (max-width: 900px) {
      .bar{grid-template-columns:1fr auto; padding:10px 12px;}
      .controls { justify-content:flex-end; }
      .media-player { grid-template-columns:auto 1fr; gap:10px; }
      .media-actions { grid-column:1 / -1; justify-content:space-between; }
      .media-volume { width:min(26vw, 110px); }
      .viewer { padding:12px 6px; }
      .page-host { gap:12px; }
    }
  </style>
</head>
<body class="start-gate-active">
  <div id="bgA" class="bg-layer active">
    <div class="bg-image"></div>
    <video class="bg-video" muted loop playsinline preload="auto"></video>
  </div>
  <div id="bgB" class="bg-layer inactive">
    <div class="bg-image"></div>
    <video class="bg-video" muted loop playsinline preload="auto"></video>
  </div>
  <div class="overlay"></div>
  <div id="loading">Carregando...</div>
  <div class="reader">
    <header id="topBar" class="bar">
      <div class="reader-heading">
        <strong id="chapterTitle">Project Ghost — Reader</strong>
        <span id="pageStatus" class="top-page-status" aria-live="polite">Página 1 / 1</span>
      </div>
      <div class="controls">
        <button id="backBtn" class="control-btn" type="button"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar</button>
        <button id="mediaToggle" class="control-btn icon-only" type="button" aria-expanded="true" aria-label="Ocultar barra de música" title="Ocultar barra de música">
          <i id="mediaToggleIcon" class="fas fa-chevron-up" aria-hidden="true"></i>
        </button>
      </div>
      <section id="mediaPlayer" class="media-player" aria-label="Barra de música">
        <div class="media-cover-wrap"><img id="mediaCover" class="media-cover" alt="Capa da música" src="assets/images/website/logo.png"></div>
        <div class="media-info">
          <div class="media-title-row">
            <div>
              <div id="mediaTitle" class="media-title">Sem música tocando</div>
              <div id="mediaSubtitle" class="media-subtitle">A trilha da cena aparece aqui.</div>
            </div>
          </div>
          <div class="media-progress-row">
            <input id="mediaProgress" class="media-progress" type="range" min="0" max="1000" step="1" value="0" aria-label="Progresso da música">
            <span id="mediaRemainingText" class="media-time">-0:00</span>
          </div>
        </div>
        <div class="media-actions">
          <button id="mediaRestart" class="media-icon-btn" type="button" aria-label="Voltar para o início da música" title="Voltar música"><i class="fas fa-backward-step" aria-hidden="true"></i></button>
          <button id="mediaPlay" class="media-icon-btn media-play" type="button" aria-label="Pausar música" title="Pausar música"><i id="mediaPlayIcon" class="fas fa-pause" aria-hidden="true"></i></button>
          <button id="mediaMute" class="media-icon-btn" type="button" aria-label="Mutar música" title="Mutar"><i id="mediaMuteIcon" class="fas fa-volume-high" aria-hidden="true"></i></button>
          <input id="mediaVolume" class="media-volume" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="Volume da música">
          <a id="mediaDownload" class="media-icon-btn" href="#" download aria-label="Baixar música" title="Baixar música"><i class="fas fa-download" aria-hidden="true"></i></a>
          <div id="visualizer" class="visualizer" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      </section>
    </header>
    <main class="viewer">
      <div class="viewer-stage">
        <div id="pageHost" class="page-host" aria-label="Todas as páginas do PDF"></div>
      </div>
    </main>
  </div>

  <div id="start" class="start">
    <div class="reader-fire-ambience" aria-hidden="true"></div>
    <canvas id="readerFireParticles" aria-hidden="true"></canvas>
    <div class="card">
      <div id="startCoverFrame" class="start-cover-frame" aria-label="Capa do capítulo"></div>
      <div class="start-actions">
        <h2 id="startTitle" class="start-title">Project Ghost</h2>
        <button id="startBtn" class="start-main-btn" type="button">Iniciar leitura</button>
      </div>
    </div>
  </div>

  <div id="audioHost" hidden></div>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
    import { chaptersData } from "./js/data.js";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

    function getStoredReaderPayload(){
      try { return JSON.parse(sessionStorage.getItem('pg_reader_chapter') || '{}'); } catch { return {}; }
    }
    function getUrlReaderPayload(){
      const params = new URLSearchParams(window.location.search);
      const volumeParam = params.get('volume');
      const chapterParam = params.get('chapter');
      if (!volumeParam || !chapterParam) return {};
      const volume = chaptersData.volumes.find((item) => String(item.volume) === String(volumeParam));
      const chapter = volume?.chapters.find((item) => item.chapter === chapterParam);
      if (!chapter) return {};
      return {
        volume: volume.volume,
        chapter: chapter.chapter,
        file: chapter.file,
        title: chapter.title,
        reader: chapter.reader
      };
    }
    const urlPayload = getUrlReaderPayload();
    const storedPayload = getStoredReaderPayload();
    const payload = urlPayload.reader ? urlPayload : storedPayload;
    const fallbackReader = {
      title: payload.title || 'Capítulo', pageStart: 1, pageEnd: 999,
      pdf: `./posts/volume${payload.volume || 1}/${payload.file || 'prologo.pdf'}`,
      scenes: [{ id:'default', label:'Cena principal', description:'Leitura', from:1, to:999, background:'assets/images/website/background_main3.png', audio:'assets/audio/clock_ambience.mp3' }]
    };
    const reader = payload.reader || fallbackReader;
    function resolveReaderPdf(pdfConfig) {
      const configuredPdf = pdfConfig && typeof pdfConfig === 'object'
        ? Object.values(pdfConfig).find((value) => typeof value === 'string' && value.trim())
        : '';
      const selected = typeof pdfConfig === 'string'
        ? pdfConfig
        : (pdfConfig?.file || pdfConfig?.src || pdfConfig?.unified || pdfConfig?.default || configuredPdf || payload.file || 'prologo.pdf');
      return selected.startsWith('./') ? selected : `./posts/volume${payload.volume || 1}/${selected}`;
    }
    const readerPdf = resolveReaderPdf(reader.pdf);

    const st = {
      doc:null,
      page:reader.pageStart || 1,
      total:1,
      zoom:1,
      minZoom:0.25,
      maxZoom:8,
      muted:false,
      mediaPaused:false,
      volume:0.55,
      mediaRaf:null,
      mediaIdleTimer:null,
      analyser:null,
      analyserData:null,
      audioCtx:null,
      renderToken:0,
      renderQuality:2,
      maxCanvasPixelRatio:4,
      renderedPages:new Set(),
      renderingPages:new Set(),
      renderAhead:3,
      defaultPageSize:null,
      layoutWidth:0,
      bgActiveLayer:null,
      bgInactiveLayer:null,
      currentScene:null,
      currentSceneAudioKey:'',
      activeAudios:[],
      pageMin: 1,
      pageMax: 1,
      startAudio:null,
      isStarting:false
    };
    const els = {
      topBar:document.getElementById('topBar'), start: document.getElementById('start'), startBtn: document.getElementById('startBtn'), chapterTitle:document.getElementById('chapterTitle'),
      back:document.getElementById('backBtn'), mediaToggle:document.getElementById('mediaToggle'), mediaToggleIcon:document.getElementById('mediaToggleIcon'),
      startTitle:document.getElementById('startTitle'), startCoverFrame:document.getElementById('startCoverFrame'), mediaPlayer:document.getElementById('mediaPlayer'), mediaCover:document.getElementById('mediaCover'), mediaTitle:document.getElementById('mediaTitle'), mediaSubtitle:document.getElementById('mediaSubtitle'), mediaCurrentText:document.getElementById('mediaCurrentText'), mediaDurationText:document.getElementById('mediaDurationText'), mediaRemainingText:document.getElementById('mediaRemainingText'), mediaProgress:document.getElementById('mediaProgress'), mediaRestart:document.getElementById('mediaRestart'), mediaPlay:document.getElementById('mediaPlay'), mediaPlayIcon:document.getElementById('mediaPlayIcon'), mediaMute:document.getElementById('mediaMute'), mediaMuteIcon:document.getElementById('mediaMuteIcon'), mediaVolume:document.getElementById('mediaVolume'), mediaDownload:document.getElementById('mediaDownload'), visualizer:document.getElementById('visualizer'),
      pageHost:document.getElementById('pageHost'), pageStatus:document.getElementById('pageStatus'),
      bgA:document.getElementById('bgA'), bgB:document.getElementById('bgB'), loading:document.getElementById('loading'), audioHost:document.getElementById('audioHost')
    };
    st.bgActiveLayer = els.bgA;
    st.bgInactiveLayer = els.bgB;

    els.chapterTitle.textContent = `Project Ghost — ${reader.title}`;
    const startScreen = reader.startScreen || {};
    els.startTitle.textContent = startScreen.title || reader.title || 'Project Ghost';
    els.startBtn.textContent = startScreen.buttonLabel || `Iniciar leitura de ${reader.title || 'capítulo'}`;
    const startBackground = startScreen.backgroundColor || startScreen.background;
    if (startBackground) els.start.style.setProperty('--start-bg', startBackground);


    function initReaderFireParticles(){
      const canvas = document.getElementById('readerFireParticles');
      if (!canvas) return;
      for (let i = 0; i < 32; i += 1) {
        const spark = document.createElement('span');
        spark.className = 'reader-fire-spark';
        spark.style.left = `${Math.random() * 100}vw`;
        spark.style.animationDuration = `${6 + Math.random() * 8}s`;
        spark.style.animationDelay = `${Math.random() * -12}s`;
        spark.style.setProperty('--drift-x', `${-80 + Math.random() * 160}px`);
        spark.style.opacity = `${0.35 + Math.random() * 0.65}`;
        els.start.appendChild(spark);
      }
      const ctx = canvas.getContext('2d');
      const particles = [];
      const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
      const spawnParticle = () => particles.push({ x:Math.random()*canvas.width, y:canvas.height+Math.random()*40, size:1+Math.random()*3, vy:.5+Math.random()*1.8, vx:-.35+Math.random()*.7, life:70+Math.random()*80, hue:18+Math.random()*25 });
      const animate = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (particles.length < 140) for (let i = 0; i < 4; i += 1) spawnParticle();
        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const p = particles[i]; p.x += p.vx; p.y -= p.vy; p.life -= 1;

        canvas.style.height = `${viewport.height}px`;
        const context = canvas.getContext('2d', { alpha:false });
        await page.render({ canvasContext:context, viewport, transform:[pixel,0,0,pixel,0,0] }).promise;
        els.startCoverFrame.replaceChildren(canvas);
      } finally {
        loading(false);
      }
    }

    function createStartAudio(){
      const src = normalizeSceneMedia(startScreen.audio)[0];
      if (!src || st.startAudio) return st.startAudio;
      const audio = createSceneAudio(src);
      audio.setAttribute('data-start-screen', 'true');
      st.startAudio = audio;
      return audio;
    }
    async function playStartScreenAudio(){
      const audio = createStartAudio();
      if (!audio) return;
      audio.muted = st.muted;
      try {
        await audio.play();
        fade(audio, Number.isFinite(audio.volume) ? audio.volume : 0, st.muted ? 0 : Math.min(st.volume, .55), 900);
      } catch {}
    }
    async function loadAndStart(){
      if (st.isStarting) return;
      st.isStarting = true;
      els.startBtn.classList.add('is-igniting');
      els.start.classList.add('is-opening');
      playFireIgnitionSound();
      if (st.startAudio) await fadeOutAndStop(st.startAudio, 750);
      st.startAudio = null;
      await new Promise((resolve) => setTimeout(resolve, 980));
      const pdfFile = readerPdf;
      loading(true, `Carregando ${pdfFile}...`);
      if (!st.doc) st.doc = await pdfjsLib.getDocument(pdfFile).promise;
      st.total = st.doc.numPages;
      st.pageMin = 1;
      st.pageMax = st.total;
      const savedPage = Number(sessionStorage.getItem('pg_reader_page'));
      const firstReadingPage = reader.startScreen ? Math.min(2, st.pageMax) : (reader.pageStart || st.pageMin);
      st.page = Math.min(Math.max(st.pageMin, savedPage || firstReadingPage), st.pageMax);
      document.body.classList.remove('start-gate-active');
      els.start.style.display='none';

      const firstScene = getScene(st.page);
      const firstAudio = normalizeSceneMedia(firstScene?.audio)[0];
      if (firstAudio && sessionStorage.getItem('pg_reader_autostart_audio') === '1') {
        const primer = createSceneAudio(firstAudio);
        try { await primer.play(); primer.pause(); primer.currentTime = 0; sessionStorage.removeItem('pg_reader_autostart_audio'); } catch {}
        primer.remove();
      }

      await setupPageFrames();
      await ensureRenderedWindow(st.page, true);
      await setCurrentSceneForPage(st.page);
      scrollToPage(st.page);
    }

    initReaderFireParticles();
    preloadStartCover().catch(() => loading(false));
    playStartScreenAudio();
    ['pointerdown', 'keydown', 'touchstart'].forEach((eventName) => {
      els.start.addEventListener(eventName, playStartScreenAudio, { once:true, passive:true });
    });
    els.startBtn.addEventListener('click', loadAndStart);
    syncZoomControl();
    hideUnavailableMediaPlayer();
    updateMediaButtons();
    els.back.addEventListener('click', ()=> { window.location.href = './ghost.html'; });
    ['pointerdown', 'keydown', 'input', 'click'].forEach((eventName) => {
      els.mediaPlayer.addEventListener(eventName, scheduleMediaAutoCollapse, { passive:true });
    });
    els.mediaToggle.addEventListener('click', () => {
      if (!getPrimaryAudio()) return hideUnavailableMediaPlayer();
      const collapsed = !els.topBar.classList.contains('media-collapsed');
      collapseMediaPlayer(collapsed);
      if (!collapsed) scheduleMediaAutoCollapse();
    });
    els.mediaPlay.addEventListener('click', async () => {
      const audio = getPrimaryAudio();
      if (!audio) return;
      st.mediaPaused = !st.mediaPaused;
      if (st.audioCtx?.state === 'suspended') await st.audioCtx.resume();
      if (st.mediaPaused) {
        st.activeAudios.forEach((item) => item.pause());
      } else {
        await Promise.all(st.activeAudios.map((item) => item.play().catch(() => {})));
      }
      updateMediaButtons();
    });
    els.mediaRestart.addEventListener('click', async () => {
      st.activeAudios.forEach((audio) => { audio.currentTime = 0; });
      if (st.mediaPaused) return updateMediaProgress();
      await Promise.all(st.activeAudios.map((audio) => audio.play().catch(() => {})));
      updateMediaButtons();
    });
    els.mediaMute.addEventListener('click', () => {
      st.muted = !st.muted;
      applyMediaVolume();
    });
    els.mediaVolume.addEventListener('input', (event) => {
      st.volume = Number(event.target.value);
      st.muted = st.volume <= 0;
      applyMediaVolume();
    });
    els.mediaProgress.addEventListener('input', (event) => {
      const audio = getPrimaryAudio();
      if (!audio?.duration) return;
      const targetTime = (Number(event.target.value) / 1000) * audio.duration;
      st.activeAudios.forEach((item) => { if (Number.isFinite(item.duration)) item.currentTime = Math.min(targetTime, item.duration); });
      updateMediaProgress();
    });
    els.mediaDownload.addEventListener('click', (event) => {
      if (!getPrimaryAudio()) event.preventDefault();
    });

    const viewer = getViewer();
    let scrollMetaTimer = null;
    viewer.addEventListener('scroll', () => {
      clearTimeout(scrollMetaTimer);
      scrollMetaTimer = setTimeout(updateCurrentPageFromScroll, 60);
    }, { passive:true });
    viewer.addEventListener('wheel', (event) => {
      if (!st.doc || !(event.ctrlKey || event.metaKey)) return;
      event.preventDefault();
      const factor = Math.exp(-event.deltaY * 0.0025);
      setZoom(st.zoom * factor, event.clientX, event.clientY);
    }, { passive:false });

    let pinchState = null;
    function getTouchCenter(touches){
      return {
        x: (touches[0].clientX + touches[1].clientX) / 2,
        y: (touches[0].clientY + touches[1].clientY) / 2
      };
    }
    function getTouchDistance(touches){
      return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    }
    viewer.addEventListener('touchstart', (event) => {
      if (!st.doc || event.touches.length !== 2) return;
      pinchState = {
        distance:getTouchDistance(event.touches),
        zoom:st.zoom
      };
    }, { passive:true });
    viewer.addEventListener('touchmove', (event) => {
      if (!st.doc || event.touches.length !== 2 || !pinchState) return;
      event.preventDefault();
      const distance = getTouchDistance(event.touches);
      const center = getTouchCenter(event.touches);
      if (pinchState.distance > 0) setZoom(pinchState.zoom * (distance / pinchState.distance), center.x, center.y);
    }, { passive:false });
    viewer.addEventListener('touchend', (event) => {
      if (event.touches.length < 2) pinchState = null;
    }, { passive:true });
    viewer.addEventListener('touchcancel', () => { pinchState = null; }, { passive:true });

    window.addEventListener('keydown',(e)=>{ if(e.key==='Home') scrollToPage(st.pageMin); if(e.key==='End') scrollToPage(st.pageMax); if(e.key.toLowerCase()==='m') els.mediaMute.click(); });
    let t; window.addEventListener('resize',()=>{
      clearTimeout(t);
      t=setTimeout(async ()=> {
        if (!st.doc) return;
        const anchor = getZoomAnchor(window.innerWidth / 2, window.innerHeight / 2);
        const nextLayoutWidth = getViewerUsableWidth();
        syncZoomControl();
        if (st.layoutWidth && Math.abs(nextLayoutWidth - st.layoutWidth) < 2) {
          applyZoomToRenderedPages(anchor);
          return;
        }
        resetRenderedPages();
        await setupPageFrames();
        await ensureRenderedWindow(st.page, true);
        applyZoomToRenderedPages(anchor);
      }, 180);
    });
  </script>
</body>
</html>
