<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Ghost — Reader Imersivo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg:#07070b;
      --text:#f3f3f3;
      --muted:#babaca;
      --panel:rgba(10,10,14,.78);
      --border:rgba(255,255,255,.09);
      --accent:#ff3a3a;
      --accent-soft: rgba(255, 58, 58, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); overflow:hidden; font-family: Georgia, serif; }
    .bg-layer { position:fixed; inset:0; transition:opacity .8s ease; overflow:hidden; background:#000; }
    .bg-layer.active { z-index:1; opacity:1; }
    .bg-layer.inactive { z-index:0; opacity:0; }
    .bg-image, .bg-video {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .bg-image { background-size:cover; background-position:center; background-repeat:no-repeat; }
    .bg-video { display:none; }
    .overlay { position:fixed; inset:0; z-index:2; background:linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.68)); }
    .reader { position:relative; z-index:5; display:grid; grid-template-rows:auto 1fr auto auto; height:100%; }
    .bar { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--border); backdrop-filter: blur(8px); box-shadow: 0 12px 28px rgba(0,0,0,.32); }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .control-btn, select, input[type=range] { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:999px; padding:8px 12px; }
    .zoom-control { display:flex; align-items:center; gap:8px; min-width:min(320px, 100%); white-space:nowrap; }
    .zoom-control input[type=range] { width:clamp(120px, 18vw, 260px); flex:1 1 120px; accent-color:var(--accent); }
    .control-btn { display:inline-flex; align-items:center; gap:8px; cursor:pointer; transition:transform .18s ease, border-color .18s ease, background .18s ease; }
    .control-btn:hover { transform:translateY(-1px); border-color:var(--accent-soft); background:rgba(255,255,255,.08); }
    .control-btn.icon-only { width:42px; height:42px; justify-content:center; padding:0; font-size:1rem; }
    .viewer {
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      padding:8px;
      min-height:0;
      position: relative;
      overflow:auto;
      overscroll-behavior:contain;
    }
    .viewer-stage {
      width: max-content;
      height: max-content;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-host {
      width: max-content;
      height: max-content;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .page-frame {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
      flex:0 0 auto;
    }
    canvas {
      display:block;
      flex:0 0 auto;
      max-width:none;
      max-height:none;
      border-radius: 12px;
      box-shadow: 0 18px 60px rgba(0,0,0,.4);
      background: #ececef;
      cursor: pointer;
      user-select: none;
    }
    .footer { padding:10px 18px; border-top:1px solid var(--border); background:var(--panel); font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; }
    .page-nav {
      display:grid;
      grid-template-columns:auto minmax(180px, 640px) auto;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:12px 18px;
      border-top:1px solid var(--border);
      background:linear-gradient(180deg, rgba(11,11,16,.72), rgba(8,8,12,.9));
      backdrop-filter: blur(10px);
      box-shadow: 0 -12px 28px rgba(0,0,0,.28);
    }
    .page-nav-btn {
      min-width:136px;
      min-height:44px;
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(135deg, rgba(255,58,58,.22), rgba(255,255,255,.045));
      color:var(--text);
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-weight:800;
      letter-spacing:.01em;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, opacity .18s ease;
    }
    .page-nav-btn:hover { transform:translateY(-2px); border-color:var(--accent-soft); box-shadow:0 10px 22px rgba(0,0,0,.34); }
    .page-nav-btn:disabled { opacity:.38; cursor:not-allowed; transform:none; box-shadow:none; }
    .page-jump { display:grid; gap:6px; color:var(--muted); font-size:12px; text-align:center; }
    .page-jump strong { color:var(--text); font-size:13px; }
    .page-jump input[type=range] { width:min(56vw, 640px); accent-color:var(--accent); cursor:grab; padding:0; background:transparent; border:none; }
    .page-jump input[type=range]:active { cursor:grabbing; }
    .tap-hint { color:var(--muted); font-size:12px; }
    .start {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 58, 58, 0.18), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255, 58, 58, 0.12), transparent 40%),
        rgba(2, 2, 8, 0.84);
      backdrop-filter: blur(9px);
    }
    .card {
      width: min(760px, 94vw);
      background: linear-gradient(180deg, rgba(18, 9, 13, 0.96), rgba(10, 8, 14, 0.96));
      border: 1px solid rgba(255, 70, 70, 0.48);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.58), 0 0 32px rgba(255, 58, 58, 0.18);
    }
    .start-title {
      margin: 0 0 8px;
      color: #ff4f4f;
      font-size: clamp(1.6rem, 2.8vw, 2.15rem);
      letter-spacing: .02em;
      text-transform: uppercase;
      font-weight: 800;
    }
    .start-description {
      margin: 0;
      color: #f1d8d8;
      line-height: 1.5;
      font-size: 1.05rem;
    }
    .layout-grid {
      margin: 22px 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .layout-option {
      min-height: 120px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      padding: 16px;
      text-align: left;
      display: grid;
      align-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all .2s ease;
    }
    .layout-option i {
      font-size: 1.5rem;
      color: #ff5b5b;
    }
    .layout-option strong {
      font-size: 1.05rem;
      letter-spacing: .02em;
    }
    .layout-option small {
      color: #dfc3c3;
      font-size: .86rem;
      line-height: 1.35;
    }
    .layout-option:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 83, 83, 0.8);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.36);
      background: linear-gradient(180deg, rgba(89, 22, 22, 0.62), rgba(21, 8, 8, 0.65));
    }
    .layout-option.active {
      border-color: rgba(255, 83, 83, 0.95);
      box-shadow: 0 0 0 1px rgba(255, 83, 83, 0.48), 0 14px 34px rgba(255, 50, 50, 0.24);
      background: linear-gradient(180deg, rgba(122, 24, 24, 0.75), rgba(35, 9, 9, 0.76));
    }
    .start-main-btn {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255, 110, 110, 0.62);
      background: linear-gradient(90deg, #b01325 0%, #ff2f3c 52%, #ff5868 100%);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: .02em;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
      text-transform: uppercase;
    }
    .start-main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(255, 61, 77, 0.45);
    }
    #loading { position:fixed; z-index:15; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.8); padding:10px 14px; border-radius:10px; border:1px solid var(--border); display:none; }
    @media (max-width: 900px) {
      .bar{flex-direction:column; align-items:flex-start; padding:10px 12px;}
      .controls { width:100%; justify-content:space-between; }
      .zoom-control { min-width:100%; }
      .zoom-control input[type=range] { width:100%; }
      .footer{flex-direction:column; gap:8px; padding:8px 12px;}
      .viewer { padding:6px; }
      .page-nav { grid-template-columns:1fr 1fr; gap:10px; padding:10px 12px; }
      .page-jump { grid-column:1 / -1; grid-row:1; }
      .page-nav-btn { min-width:0; width:100%; min-height:46px; }
      .page-jump input[type=range] { width:100%; }
      .tap-hint { display:none; }
      .layout-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="bgA" class="bg-layer active">
    <div class="bg-image"></div>
    <video class="bg-video" muted loop playsinline preload="auto"></video>
  </div>
  <div id="bgB" class="bg-layer inactive">
    <div class="bg-image"></div>
    <video class="bg-video" muted loop playsinline preload="auto"></video>
  </div>
  <div class="overlay"></div>
  <div id="loading">Carregando...</div>
  <div class="reader">
    <header class="bar">
      <strong id="chapterTitle">Project Ghost — Reader</strong>
      <div class="controls">
        <button id="muteBtn" class="control-btn" type="button" aria-label="Desativar som" title="Som ligado">
          <i id="muteIcon" class="fas fa-volume-high" aria-hidden="true"></i>
          <span id="muteLabel">Som ligado</span>
        </button>
        <button id="backBtn" class="control-btn" type="button"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar</button>
        <label class="zoom-control">Zoom <input id="zoom" type="range" min="0.75" max="3" step="0.05" value="1"></label>
      </div>
    </header>
    <main class="viewer">
      <div class="viewer-stage">
        <div class="page-host">
          <div class="page-frame">
            <canvas id="pdfCanvas" aria-label="Página do PDF. Clique na metade direita para avançar ou na metade esquerda para voltar."></canvas>
          </div>
        </div>
      </div>
    </main>
    <nav class="page-nav" aria-label="Navegação de páginas">
      <button id="prevBtn" class="page-nav-btn" type="button" aria-label="Página anterior">
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
        <span>Anterior</span>
      </button>
      <label class="page-jump" for="pageScrubber">
        <strong id="pageJumpStatus">Página 1 de 1</strong>
        <input id="pageScrubber" type="range" min="1" max="1" step="1" value="1" aria-label="Arrastar para escolher a página">
        <span class="tap-hint">Arraste para qualquer página, use ←/→ no teclado, ou clique/toque nas laterais do PDF.</span>
      </label>
      <button id="nextBtn" class="page-nav-btn" type="button" aria-label="Próxima página">
        <span>Próxima</span>
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
      </button>
    </nav>
    <footer class="footer">
      <span id="pageStatus">Página 1 / 1</span>
      <span id="sceneStatus">Cena: --</span>
    </footer>
  </div>

  <div id="start" class="start">
    <div class="card">
      <h2 class="start-title">Antes de começar</h2>
      <p class="start-description">Escolha o formato da leitura imersiva para o capítulo. A trilha é iniciada junto do início da leitura.</p>
      <div class="layout-grid">
        <button class="layout-option" data-layout-option="desktop" type="button">
          <i class="fas fa-desktop"></i>
          <strong>Modo Desktop</strong>
          <small>Página maior e espaçamento ideal para tela ampla.</small>
        </button>
        <button class="layout-option" data-layout-option="mobile" type="button">
          <i class="fas fa-mobile-screen-button"></i>
          <strong>Modo Mobile</strong>
          <small>Viewport ajustado para leitura em celular.</small>
        </button>
      </div>
      <button id="startBtn" class="start-main-btn" type="button">Começar leitura</button>
    </div>
  </div>

  <div id="audioHost" hidden></div>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

    const payload = JSON.parse(sessionStorage.getItem('pg_reader_chapter') || '{}');
    const fallbackReader = {
      title: payload.title || 'Capítulo', pageStart: 1, pageEnd: 999,
      pdf: `./posts/volume${payload.volume || 1}/${payload.file || 'prologo.pdf'}`,
      scenes: [{ id:'default', label:'Cena principal', description:'Leitura', from:1, to:999, background:'assets/images/website/background_main3.png', audio:'assets/audio/clock_ambience.mp3' }]
    };
    const reader = payload.reader || fallbackReader;
    function resolveReaderPdf(pdfConfig) {
      const selected = typeof pdfConfig === 'string'
        ? pdfConfig
        : (pdfConfig?.file || pdfConfig?.src || pdfConfig?.desktop || pdfConfig?.mobile || payload.file || 'prologo.pdf');
      return selected.startsWith('./') ? selected : `./posts/volume${payload.volume || 1}/${selected}`;
    }
    const readerPdf = resolveReaderPdf(reader.pdf);

    const st = {
      doc:null,
      page:reader.pageStart || 1,
      total:1,
      zoom:1,
      layout:payload.layout || 'auto',
      muted:false,
      isRendering:false,
      pendingPage:null,
      bgActiveLayer:null,
      bgInactiveLayer:null,
      currentScene:null,
      currentSceneAudioKey:'',
      activeAudios:[],
      pageMin: 1,
      pageMax: 1
    };
    const els = {
      start: document.getElementById('start'), startBtn: document.getElementById('startBtn'), chapterTitle:document.getElementById('chapterTitle'),
      prev:document.getElementById('prevBtn'), next:document.getElementById('nextBtn'), mute:document.getElementById('muteBtn'), muteIcon:document.getElementById('muteIcon'), muteLabel:document.getElementById('muteLabel'), back:document.getElementById('backBtn'),
      zoom:document.getElementById('zoom'), canvas:document.getElementById('pdfCanvas'), pageStatus:document.getElementById('pageStatus'), pageJumpStatus:document.getElementById('pageJumpStatus'), pageScrubber:document.getElementById('pageScrubber'), sceneStatus:document.getElementById('sceneStatus'),
      bgA:document.getElementById('bgA'), bgB:document.getElementById('bgB'), loading:document.getElementById('loading'), audioHost:document.getElementById('audioHost')
    };
    const ctx = els.canvas.getContext('2d', { alpha:false });
    st.bgActiveLayer = els.bgA;
    st.bgInactiveLayer = els.bgB;

    els.chapterTitle.textContent = `Project Ghost — ${reader.title}`;
    const defaultLayout = payload.layout && payload.layout !== 'auto'
      ? payload.layout
      : (window.innerWidth <= 768 ? 'mobile' : 'desktop');
    let selectedLayout = defaultLayout;

    document.querySelectorAll('[data-layout-option]').forEach((btn) => {
      const isActive = btn.getAttribute('data-layout-option') === selectedLayout;
      btn.classList.toggle('active', isActive);
      btn.addEventListener('click', () => {
        selectedLayout = btn.getAttribute('data-layout-option') || 'desktop';
        document.querySelectorAll('[data-layout-option]').forEach((item) => item.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    function loading(on,msg){ els.loading.style.display = on ? 'block' : 'none'; if(msg) els.loading.textContent=msg; }
    function getScene(page){ return (reader.scenes || []).find(s => page >= s.from && page <= s.to) || (reader.scenes || [])[0]; }
    function updateMeta(scene){
      const pageText = `Página ${st.page} / ${st.total}`;
      els.pageStatus.textContent = pageText;
      els.pageJumpStatus.textContent = `Página ${st.page} de ${st.total}`;
      els.pageScrubber.value = String(st.page);
      els.sceneStatus.textContent = `Cena: ${scene?.label || '--'} • páginas ${scene?.from || 1}-${scene?.to || st.total}`;
    }
    function updateMuteButton(){
      els.muteIcon.className = st.muted ? 'fas fa-volume-xmark' : 'fas fa-volume-high';
      els.muteLabel.textContent = st.muted ? 'Som desligado' : 'Som ligado';
      els.mute.setAttribute('aria-label', st.muted ? 'Ativar som' : 'Desativar som');
      els.mute.title = st.muted ? 'Som desligado' : 'Som ligado';
    }
    function goToPage(pageNo){
      const target = Math.min(Math.max(st.pageMin, Number(pageNo) || st.pageMin), st.pageMax);
      if (target === st.page && !st.isRendering) return;
      renderPage(target);
    }
    function getLayoutLimit(layout, key) {
      const limitsByLayout = reader.pageLimits?.[layout] || reader.pageRange?.[layout] || null;
      if (limitsByLayout && Number.isFinite(Number(limitsByLayout[key]))) return Number(limitsByLayout[key]);

      if (reader[key] && typeof reader[key] === 'object' && Number.isFinite(Number(reader[key][layout]))) {
        return Number(reader[key][layout]);
      }

      return Number(reader[key]);
    }
    function getMaxScenePage() {
      const scenes = Array.isArray(reader.scenes) ? reader.scenes : [];
      if (!scenes.length) return 1;
      return scenes.reduce((maxPage, scene) => Math.max(maxPage, Number(scene?.to) || 1), 1);
    }
    function applySceneTheme(scene){
      const theme = scene?.theme || {};
      if (theme.accent) document.documentElement.style.setProperty('--accent', theme.accent);
      if (theme.panel) document.documentElement.style.setProperty('--panel', theme.panel);
      if (theme.text) document.documentElement.style.setProperty('--text', theme.text);
      if (theme.muted) document.documentElement.style.setProperty('--muted', theme.muted);
      if (theme.accent) document.documentElement.style.setProperty('--accent-soft', `${theme.accent}66`);
    }

    function isNoneValue(value){
      return typeof value === 'string' && value.trim().toLowerCase() === 'none';
    }
    function normalizeSceneMedia(value){
      if (Array.isArray(value)) return value.map((item) => String(item || '').trim()).filter((item) => item && !isNoneValue(item));
      if (value == null) return [];
      const one = String(value).trim();
      if (!one || isNoneValue(one)) return [];
      return [one];
    }
    function resolveBackgroundType(path){
      const cleanPath = String(path || '').split('?')[0].toLowerCase();
      if (/\.(mp4|webm|ogg|mov|m4v)$/.test(cleanPath)) return 'video';
      return 'image';
    }
    function getLayerEls(layer){
      return {
        image: layer.querySelector('.bg-image'),
        video: layer.querySelector('.bg-video')
      };
    }
    async function applyBackgroundToLayer(layer, backgroundValue){
      const { image, video } = getLayerEls(layer);
      const selected = normalizeSceneMedia(backgroundValue)[0] || '';
      if (!selected) {
        image.style.backgroundImage = '';
        image.style.display = 'none';
        video.pause();
        video.removeAttribute('src');
        video.load();
        video.style.display = 'none';
        layer.style.background = '#000';
        return;
      }

      layer.style.background = '#000';
      const backgroundType = resolveBackgroundType(selected);
      if (backgroundType === 'video') {
        image.style.display = 'none';
        image.style.backgroundImage = '';
        video.style.display = 'block';
        if (video.getAttribute('data-src') !== selected) {
          video.pause();
          video.src = selected;
          video.setAttribute('data-src', selected);
          video.currentTime = 0;
        }
        try { await video.play(); } catch {}
        return;
      }

      video.pause();
      video.removeAttribute('src');
      video.load();
      video.style.display = 'none';
      image.style.display = 'block';
      image.style.backgroundImage = `url('${selected}')`;
    }
    async function setSceneBackground(scene){
      await applyBackgroundToLayer(st.bgInactiveLayer, scene?.background);
      st.bgInactiveLayer.classList.remove('inactive');
      st.bgInactiveLayer.classList.add('active');
      st.bgActiveLayer.classList.remove('active');
      st.bgActiveLayer.classList.add('inactive');
      [st.bgActiveLayer, st.bgInactiveLayer] = [st.bgInactiveLayer, st.bgActiveLayer];
    }

    function fade(audio,from,to,d=700){ const t0=performance.now(); const run=(t)=>{ const p=Math.min(1,(t-t0)/d); audio.volume=Math.max(0,Math.min(1,from+(to-from)*p)); if(p<1) requestAnimationFrame(run); }; requestAnimationFrame(run); }
    async function fadeOutAndStop(audio, duration = 500) {
      const startVolume = Number.isFinite(audio.volume) ? audio.volume : 0.55;
      fade(audio, startVolume, 0, duration);
      await new Promise((resolve) => setTimeout(resolve, duration + 40));
      audio.pause();
      audio.currentTime = 0;
      audio.removeAttribute('src');
      audio.load();
      audio.remove();
    }
    function createSceneAudio(src){
      const audio = document.createElement('audio');
      audio.loop = true;
      audio.preload = 'auto';
      audio.setAttribute('data-src', src);
      audio.src = src;
      audio.volume = 0;
      els.audioHost.appendChild(audio);
      return audio;
    }
    async function setSceneAudio(scene){
      const sceneAudioList = normalizeSceneMedia(scene?.audio);
      const sceneAudioKey = sceneAudioList.join('|');
      if (sceneAudioKey === st.currentSceneAudioKey) return;

      const previousAudios = [...st.activeAudios];
      st.activeAudios = [];
      st.currentSceneAudioKey = sceneAudioKey;

      if (st.muted || sceneAudioList.length === 0) {
        await Promise.all(previousAudios.map((audio) => fadeOutAndStop(audio, 450)));
        return;
      }

      const nextAudios = sceneAudioList.map((src) => createSceneAudio(src));
      st.activeAudios = nextAudios;

      await Promise.all(nextAudios.map(async (audio) => {
        try {
          await audio.play();
          fade(audio, 0, 0.55, 1200);
        } catch {}
      }));
      await Promise.all(previousAudios.map((audio) => fadeOutAndStop(audio, 900)));
    }

    async function renderPage(pageNo){
      if(!st.doc) return;
      const targetPage = Math.min(Math.max(st.pageMin, Number(pageNo) || st.pageMin), st.pageMax);
      if (st.isRendering) { st.pendingPage = targetPage; return; }
      st.isRendering = true;
      loading(true,`Renderizando página ${targetPage}...`);
      try {
        const pg = await st.doc.getPage(targetPage); const base = pg.getViewport({scale:1});
        const viewer = document.querySelector('.viewer');
        const viewerStyles = viewer ? getComputedStyle(viewer) : null;
        const horizontalPadding = viewerStyles ? parseFloat(viewerStyles.paddingLeft) + parseFloat(viewerStyles.paddingRight) : 16;
        const verticalPadding = viewerStyles ? parseFloat(viewerStyles.paddingTop) + parseFloat(viewerStyles.paddingBottom) : 16;
        const vw = Math.max(1, (viewer?.clientWidth || window.innerWidth) - horizontalPadding);
        const vh = Math.max(1, (viewer?.clientHeight || window.innerHeight) - verticalPadding);
        const fit = Math.min(vw/base.width, vh/base.height); const scale = Math.max(0.2, fit * st.zoom); const vp = pg.getViewport({scale});
        const pixel = window.devicePixelRatio || 1; els.canvas.width = Math.floor(vp.width * pixel); els.canvas.height = Math.floor(vp.height * pixel);
        els.canvas.style.width = `${vp.width}px`; els.canvas.style.height = `${vp.height}px`; ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,els.canvas.width,els.canvas.height);
        await pg.render({ canvasContext:ctx, viewport:vp, transform: pixel!==1 ? [pixel,0,0,pixel,0,0] : null }).promise;

        const scene = getScene(targetPage); if(scene && st.currentScene !== scene.id){ await setSceneBackground(scene); applySceneTheme(scene); try{ await setSceneAudio(scene); } catch { console.warn('Áudio bloqueado ou arquivo ausente.'); }
          st.currentScene = scene.id; }
        st.page = targetPage; updateMeta(scene); sessionStorage.setItem('pg_reader_page', String(st.page));
        els.prev.disabled = st.page <= st.pageMin;
        els.next.disabled = st.page >= st.pageMax;
      } finally {
        loading(false);
        st.isRendering = false;
        if (st.pendingPage && st.pendingPage !== st.page) {
          const queuedPage = st.pendingPage;
          st.pendingPage = null;
          renderPage(queuedPage);
        } else {
          st.pendingPage = null;
        }
      }
    }

    async function loadAndStart(){
      st.layout = selectedLayout;
      const pdfFile = readerPdf;
      loading(true, `Carregando ${pdfFile}...`);
      st.doc = await pdfjsLib.getDocument(pdfFile).promise;
      st.total = st.doc.numPages;
      const configuredPageStart = Math.max(1, getLayoutLimit(selectedLayout, 'pageStart') || 1);
      const configuredPageEnd = Math.max(
        configuredPageStart,
        getLayoutLimit(selectedLayout, 'pageEnd') || configuredPageStart,
        getMaxScenePage()
      );
      st.pageMin = Math.min(configuredPageStart, st.total);
      st.pageMax = Math.min(configuredPageEnd, st.total);
      els.pageScrubber.min = String(st.pageMin);
      els.pageScrubber.max = String(st.pageMax);

      const savedPage = Number(sessionStorage.getItem('pg_reader_page'));
      st.page = Math.min(Math.max(st.pageMin, savedPage || st.pageMin), st.pageMax);
      els.start.style.display='none';

      const firstScene = getScene(st.page);
      const firstAudio = normalizeSceneMedia(firstScene?.audio)[0];
      if (firstAudio && sessionStorage.getItem('pg_reader_autostart_audio') === '1') {
        const primer = createSceneAudio(firstAudio);
        try { await primer.play(); primer.pause(); primer.currentTime = 0; sessionStorage.removeItem('pg_reader_autostart_audio'); } catch {}
        primer.remove();
      }

      await renderPage(st.page);
    }

    els.startBtn.addEventListener('click', loadAndStart);
    els.prev.addEventListener('click', ()=> goToPage(st.page - 1));
    els.next.addEventListener('click', ()=> goToPage(st.page + 1));
    els.pageScrubber.addEventListener('input', () => {
      els.pageJumpStatus.textContent = `Página ${els.pageScrubber.value} de ${st.total}`;
    });
    els.pageScrubber.addEventListener('change', () => goToPage(els.pageScrubber.value));
    function updateZoomRange(){
      const smallScreen = window.innerWidth <= 700;
      els.zoom.max = smallScreen ? '2.6' : '3.5';
      els.zoom.min = smallScreen ? '0.7' : '0.75';
      if (Number(els.zoom.value) > Number(els.zoom.max)) els.zoom.value = els.zoom.max;
      if (Number(els.zoom.value) < Number(els.zoom.min)) els.zoom.value = els.zoom.min;
      st.zoom = Number(els.zoom.value);
    }
    updateZoomRange();
    els.zoom.addEventListener('input', ()=> { st.zoom = Number(els.zoom.value); renderPage(st.page); });
    els.back.addEventListener('click', ()=> { window.location.href = './ghost.html'; });
    els.mute.addEventListener('click', ()=> {
      st.muted = !st.muted; updateMuteButton();
      if(st.muted){ st.activeAudios.forEach((audio)=> fade(audio, audio.volume || .55, 0, 400)); setTimeout(()=>{ st.activeAudios.forEach((audio)=>audio.pause()); }, 450); }
      else { st.currentSceneAudioKey = ''; const scene = getScene(st.page); setSceneAudio(scene).catch(()=>{}); }
    });

    let suppressCanvasClick = false;
    els.canvas.addEventListener('click', (event) => {
      if (suppressCanvasClick) { suppressCanvasClick = false; return; }
      const bounds = els.canvas.getBoundingClientRect();
      goToPage(event.clientX - bounds.left > bounds.width / 2 ? st.page + 1 : st.page - 1);
    });
    let pointerStartX = 0;
    els.canvas.addEventListener('pointerdown', (event) => { pointerStartX = event.clientX; });
    els.canvas.addEventListener('pointerup', (event) => {
      const delta = event.clientX - pointerStartX;
      if (Math.abs(delta) > 48) {
        suppressCanvasClick = true;
        goToPage(delta < 0 ? st.page + 1 : st.page - 1);
      }
    });

    window.addEventListener('keydown',(e)=>{ if(e.key==='ArrowRight') goToPage(st.page + 1); if(e.key==='ArrowLeft') goToPage(st.page - 1); if(e.key.toLowerCase()==='m') els.mute.click(); });
    let t; window.addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(()=> { updateZoomRange(); if (st.doc) renderPage(st.page); }, 180); });
  </script>
</body>
</html>
